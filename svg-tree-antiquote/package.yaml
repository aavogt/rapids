name: svg-tree-antiquote

license: GPL

default-extensions:
  - QuasiQuotes
  - TemplateHaskell
  - LambdaCase
  - ImplicitParams
  - NoMonomorphismRestriction
  - StandaloneDeriving
  - DeriveLift
  - FlexibleInstances
  - MultiParamTypeClasses
  - RankNTypes
  - DeriveGeneric


dependencies:
  - base
  - BNFC-meta
  - svg-tree
  - template-haskell
  - linear
  - lens

library:
  source-dirs:
    - lib
